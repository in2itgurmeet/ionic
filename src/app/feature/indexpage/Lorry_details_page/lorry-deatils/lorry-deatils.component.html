<ion-row>

  <ion-header class="bg-white tab-bar">
    <div class="tab-bar g-0">
      <a [ngClass]="{'active': activeTab === 1}" (click)="setActiveTab(1)">Lorry Receipt</a>
      <a [ngClass]="{'active': activeTab === 2}" (click)="setActiveTab(2)">Shipping Label</a>
      <a [ngClass]="{'active': activeTab === 3}" (click)="setActiveTab(3)">Proof of Delivery</a>
    </div>
  </ion-header>

  @if (activeTab == 1) {
  <app-lorry-receipt [orderId]="orderId"></app-lorry-receipt>
  }
  @if (activeTab == 2) {
  <app-shiping-lable [orderId]="orderId"></app-shiping-lable>
  }
  @if (activeTab == 3) {
  <app-proof-of-delivery [orderId]="orderId"></app-proof-of-delivery>
  }


</ion-row>
