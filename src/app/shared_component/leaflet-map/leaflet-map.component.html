<div class="map-wrapper">
  <div #mapContainer class="map-container"></div>
    @if (showDirections && directions.length > 0) {
      <div class="directions-panel">
        <h6 class="fw-bold text-primary mb-3">
          <i class="fa fa-map-signs me-2"></i> Directions
        </h6>
        @for (step of directions; track $index) {
        <div class="direction-step">
          <p class="mb-1 fw-semibold text-capitalize"><i class="fa fa-arrow-circle-right text-muted me-2"></i> {{
            step.instruction }}</p>
          <small class="text-muted ms-4">{{ step.distance }}</small>
        </div>
        }
      </div>
    }
</div>
